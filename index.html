<!--
FLEX GO. Brutalist LP
Concept: Raw, bold, and direct. Black and white with a single accent color.
Tech: Vanilla JS, CSS Grid, Google Fonts, Feather Icons.
Performance: Single file, lazy loading, aiming for Lighthouse >90.
-->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX GO. - Brutalist Freight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000; --white: #FFFFFF; --accent: #FF6B00;
            --font-heading: "Anton", sans-serif; --font-body: "Inter", sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; background-color: var(--white); }
        body {
            background-color: var(--white); color: var(--black);
            font-family: var(--font-body); font-size: 1rem; line-height: 1.4;
            padding: 32px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            border: 2px solid var(--black);
        }
        .dark-bg { background-color: var(--black); color: var(--white); }
        .dotted-bg {
            background-image: radial-gradient(var(--black) 1px, transparent 0);
            background-size: 10px 10px;
        }
        h1, h2, h3 { font-family: var(--font-heading); letter-spacing: -1px; }
        h2 { font-size: 8vw; }
        section {
            min-height: 100vh; display: grid; grid-template-columns: repeat(12, 1fr);
            border-bottom: 2px solid var(--black); padding: 32px;
        }
        .header {
            position: sticky; top: 0; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px; border-bottom: 2px solid var(--black);
            background-color: var(--white);
        }
        .header-logo { font-family: var(--font-heading); font-size: 2rem; text-decoration: none; color: var(--black); }
        .header-nav a { margin-left: 24px; text-decoration: none; color: var(--black); font-weight: bold; }
        #hero {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #hero h2 {
            writing-mode: vertical-rl;
            animation: spinToHorizontal 3s linear 1 forwards;
            font-size: 15vw;
            transform-origin: center;
        }
        @keyframes spinToHorizontal {
            from { transform: rotate(0deg); }
            to { transform: rotate(-90deg); }
        }
        #reason { grid-gap: 32px; align-content: center; }
        .reason-card {
            grid-column: span 6; border: 2px solid var(--black); padding: 24px;
            transition: border-color 0.1s linear;
        }
        .reason-card:hover { border-color: var(--accent); }
        #stats { align-content: center; text-align: center; }
        .stat-item { grid-column: span 4; }
        .stat-number { font-family: var(--font-heading); font-size: 10vw; }
        #gallery {
            display: grid;
            grid-template-columns: 1fr;
            border-bottom: 2px solid var(--black);
        }
        .gallery-img {
            width: 100%; height: 100vh; object-fit: cover;
            clip-path: inset(100% 0 0 0); transition: clip-path 1s ease-in-out;
        }
        .gallery-img.in-view {
            clip-path: inset(0 0 0 0);
        }
        #contact { align-content: center; }
        .contact-form { grid-column: 4 / span 6; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; }
        .form-input {
            width: 100%; padding: 0.75rem; border: 2px solid var(--black);
            background-color: var(--white); color: var(--black); font-size: 1rem;
        }
        .form-input:focus {
            outline: none; background-color: var(--black); color: var(--white);
        }
        .submit-btn {
            width: 100%; padding: 1rem; border: 2px solid var(--black);
            background-color: var(--black); color: var(--white); font-size: 1.2rem;
            cursor: pointer; transition: background-color 0.2s, color 0.2s;
        }
        .submit-btn:hover { background-color: var(--white); color: var(--black); }
        .footer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 32px;
        }
        .footer-socials a {
            margin-left: 16px; display: inline-block;
            transition: transform 0.2s ease-out;
        }
        .footer-socials a:hover { transform: translateY(-10px); }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <a href="#" class="header-logo" aria-label="FLEX GO. Homepage">FLEX GO.</a>
        <nav class="header-nav" aria-label="Main Navigation">
            <a href="#reason">Reason</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="hero" class="dark-bg dotted-bg">
            <h2 aria-label="FLEX GO.">FLEX&nbsp;GO.</h2>
        </section>

        <section id="reason">
            <div class="reason-card"><h3>30年無事故</h3><p>創業以来、安全は我々の最優先事項。信頼と実績がここにあります。</p></div>
            <div class="reason-card"><h3>24H/365D対応</h3><p>いつでも、どこへでも。お客様のビジネスを止めません。</p></div>
            <div class="reason-card"><h3>全国ネットワーク</h3><p>日本全国を網羅する配送網で、あらゆるニーズに応えます。</p></div>
            <div class="reason-card"><h3>柔軟な料金体系</h3><p>無駄を削ぎ落とし、お客様に最適なプランを提案します。</p></div>
        </section>

        <section id="stats" class="dark-bg">
            <div class="stat-item"><div class="stat-number" data-target="120">0</div><p>年間契約社数</p></div>
            <div class="stat-item"><div class="stat-number" data-target="1200">0</div><p>月間配送件数</p></div>
            <div class="stat-item"><div class="stat-number" data-target="3">0</div><p>営業日以内見積</p></div>
        </section>

        <div id="gallery">
            <img src="https://images.unsplash.com/photo-1576156649339-4a9b674a5946?q=80&w=2070"
                 alt="広大な工業用倉庫の内部" class="gallery-img" loading="lazy">
            <img src="https://images.unsplash.com/photo-1586436482429-34a24592c23a?q=80&w=2070"
                 alt="都市の通りに駐車された白い配送バン" class="gallery-img" loading="lazy">
            <img src="https://images.unsplash.com/photo-1605711217217-65b647a27609?q=80&w=2070"
                 alt="コンテナが積み上げられた貨物港" class="gallery-img" loading="lazy">
        </div>

        <section id="contact">
            <form class="contact-form" action="#" method="POST">
                <h2>CONTACT</h2>
                <div class="form-group">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" name="message" rows="4" class="form-input" required></textarea>
                </div>
                <button type="submit" class="submit-btn">SEND</button>
            </form>
        </section>
    </main>

    <footer class="footer dark-bg">
        <p>&copy; 2025 FLEX GO.</p>
        <div class="footer-socials">
            <a href="#" aria-label="X"><i data-feather="twitter"></i></a>
            <a href="#" aria-label="Instagram"><i data-feather="instagram"></i></a>
            <a href="#" aria-label="TikTok"><i data-feather="send"></i></a>
        </div>
    </footer>
</div>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        feather.replace({ 'stroke-width': 2, width: 24, height: 24 });

        const countUp = (el) => {
            const target = +el.dataset.target;
            let count = 0;
            const interval = setInterval(() => {
                const step = Math.ceil(target / 50);
                count += step;
                if (count >= target) {
                    el.innerText = target;
                    clearInterval(interval);
                } else {
                    el.innerText = count;
                }
            }, 40);
        };

        const galleryObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in-view');
                }
            });
        }, { threshold: 0.2 });

        const statsObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    document.querySelectorAll('.stat-number').forEach(countUp);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.8 });

        document.querySelectorAll('.gallery-img').forEach(img => galleryObserver.observe(img));
        statsObserver.observe(document.querySelector('#stats'));
    </script>
</body>
</html>
